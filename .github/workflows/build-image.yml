name: build-image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .github/workflows/build-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/futurials/render-vast
  # tag legible: tiene que coincidir con las versiones del Dockerfile
  TAG: hf0.8.140-chrome152.0.7977.30-node24.21.0

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: El tag coincide con el Dockerfile
        run: |
          for v in "HF_VERSION=0.8.140" "CHROME_VERSION=152.0.7977.30" "NODE_VERSION=v24.21.0"; do
            grep -qx "ARG $v" Dockerfile || { echo "::error::el Dockerfile no tiene ARG $v; actualizá TAG"; exit 1; }
          done

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          labels: org.opencontainers.image.revision=${{ github.sha }}

      - name: Digest y tamaño
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$IMAGE@$DIGEST" --raw > manifest.json
          comp=$(jq '[.layers[].size] | add' manifest.json)
          {
            echo "### $IMAGE"
            echo
            echo "- tag: \`$TAG\`"
            echo "- digest: \`$DIGEST\`"
            echo "- tamaño comprimido: $comp bytes ($(( comp / 1048576 )) MiB)"
            echo "- fijar como: \`$IMAGE@$DIGEST\`"
          } | tee -a "$GITHUB_STEP_SUMMARY"
